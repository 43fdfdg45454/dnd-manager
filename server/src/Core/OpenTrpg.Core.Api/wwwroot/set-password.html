<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Establecer contraseña · OpenTRPG</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --card: #ffffff;
      --text: #1f1b16;
      --muted: #6b6259;
      --border: #d8d0c4;
      --accent: #8b1e1e;
      --accent-text: #ffffff;
      --ok-bg: #e6f4ea;
      --ok-text: #1e5b2e;
      --err-bg: #fbe9e7;
      --err-text: #8b1e1e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171512;
        --card: #221f1b;
        --text: #eee8df;
        --muted: #a89f94;
        --border: #3a352f;
        --accent: #c2413b;
        --accent-text: #ffffff;
        --ok-bg: #1d3324;
        --ok-text: #a6d9b3;
        --err-bg: #3a1f1d;
        --err-text: #f2b8b2;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    p.lead { margin: 0 0 20px; color: var(--muted); }
    label { display: block; font-weight: 600; margin: 12px 0 4px; }
    input {
      width: 100%;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .hint { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-text);
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    .message { margin-top: 16px; padding: 12px; border-radius: 8px; }
    .message.ok { background: var(--ok-bg); color: var(--ok-text); }
    .message.error { background: var(--err-bg); color: var(--err-text); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Establecer contraseña</h1>
    <p class="lead">OpenTRPG</p>

    <form id="form" novalidate>
      <label for="password">Nueva contraseña</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required>
      <div class="hint">Mínimo 10 caracteres.</div>

      <label for="confirm">Repite la contraseña</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="10" required>

      <button id="submit" type="submit">Guardar contraseña</button>
    </form>

    <div id="message" class="message" role="status" aria-live="polite" hidden></div>
  </main>

  <script>
    (function () {
      var MIN_LENGTH = 10;
      var form = document.getElementById('form');
      var password = document.getElementById('password');
      var confirm = document.getElementById('confirm');
      var submit = document.getElementById('submit');
      var message = document.getElementById('message');

      var token = new URLSearchParams(window.location.search).get('token');
      // Remove the secret token from the address bar and history once it has been read.
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, '', window.location.pathname);
      }

      function show(text, ok) {
        message.textContent = text;
        message.className = 'message ' + (ok ? 'ok' : 'error');
        message.hidden = false;
      }

      if (!token) {
        form.hidden = true;
        show('El enlace no es válido: falta el token. Abre de nuevo el enlace del correo.', false);
        return;
      }

      function firstError(problem) {
        if (problem && problem.errors) {
          var keys = ['token', 'password'];
          for (var i = 0; i < keys.length; i++) {
            var list = problem.errors[keys[i]];
            if (list && list.length) { return list[0]; }
          }
          for (var key in problem.errors) {
            if (problem.errors[key] && problem.errors[key].length) { return problem.errors[key][0]; }
          }
        }
        return (problem && problem.detail) || 'No se ha podido guardar la contraseña.';
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        message.hidden = true;

        if (password.value.length < MIN_LENGTH) {
          show('La contraseña debe tener al menos ' + MIN_LENGTH + ' caracteres.', false);
          password.focus();
          return;
        }
        if (password.value !== confirm.value) {
          show('Las contraseñas no coinciden.', false);
          confirm.focus();
          return;
        }

        submit.disabled = true;
        fetch('/api/v1/auth/password/set', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ token: token, password: password.value })
        })
          .then(function (response) {
            if (response.status === 204) {
              form.hidden = true;
              show('Contraseña guardada. Ya puedes iniciar sesión en la app de OpenTRPG.', true);
              return;
            }
            return response.json()
              .catch(function () { return null; })
              .then(function (problem) {
                show(firstError(problem), false);
                submit.disabled = false;
              });
          })
          .catch(function () {
            show('No se ha podido conectar con el servidor. Inténtalo de nuevo.', false);
            submit.disabled = false;
          });
      });
    })();
  </script>
</body>
</html>

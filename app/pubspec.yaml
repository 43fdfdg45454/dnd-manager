name: dnd_companion
description: Companion app para campañas de D&D 5e en sesiones presenciales.
publish_to: 'none'
# La versión real la calcula GitVersion (GitVersion.yml) y la CI la pasa con --build-name y
# --build-number; este valor solo se usa en compilaciones locales.
version: 0.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  connectivity_plus: ^7.3.2
  crypto: ^3.0.7
  dio: ^5.11.1
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  go_router: ^18.0.2
  image_picker: ^1.2.3
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  pdfrx: ^2.6.5
  shared_preferences: ^2.5.5
  signalr_netcore: ^1.4.4
  table_calendar: ^3.3.0
  timezone: ^0.11.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/licenses/
  fonts:
    # SIL OFL, see assets/licenses. Almendra ships static Regular and Bold
    # files; Source Sans 3 is a variable font (one file serves every weight,
    # selected with fontVariations).
    - family: Almendra
      fonts:
        - asset: assets/fonts/Almendra-Regular.ttf
          weight: 400
        - asset: assets/fonts/Almendra-Bold.ttf
          weight: 700
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/SourceSans3.ttf
          weight: 400
        - asset: assets/fonts/SourceSans3.ttf
          weight: 600
        - asset: assets/fonts/SourceSans3.ttf
          weight: 700
        - asset: assets/fonts/SourceSans3-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/SourceSans3-Italic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/SourceSans3-Italic.ttf
          weight: 700
          style: italic

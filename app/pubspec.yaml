name: opentrpg
description: Companion app para campañas de D&D 5e en sesiones presenciales.
publish_to: 'none'
# La versión real la calcula GitVersion (GitVersion.yml) y la CI la pasa con --build-name y
# --build-number; este valor solo se usa en compilaciones locales.
version: 0.0.0+1

environment:
  sdk: ^3.13.5

# Workspace de pub: el anfitrión y los dos paquetes comparten un solo pubspec.lock.
workspace:
  - packages/core
  - packages/dnd5e

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  opentrpg_core: any
  opentrpg_dnd5e: any
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.5

dev_dependencies:
  dio: ^5.11.1
  drift: ^2.35.1
  flutter_svg: ^2.3.0
  flutter_test:
    sdk: flutter
  go_router: ^18.0.2
  image_picker: ^1.2.3
  signalr_netcore: ^1.4.4
  table_calendar: ^3.3.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/licenses/
  fonts:
    # SIL OFL, see assets/licenses. Almendra ships static Regular and Bold
    # files and IM Fell English a static Regular; Source Sans 3, Cinzel,
    # Atkinson Hyperlegible Next and Lora are variable fonts (one file serves
    # every weight, selected with fontVariations). Chosen on "Personalización".
    - family: Almendra
      fonts:
        - asset: assets/fonts/Almendra-Regular.ttf
          weight: 400
        - asset: assets/fonts/Almendra-Bold.ttf
          weight: 700
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/SourceSans3.ttf
          weight: 400
        - asset: assets/fonts/SourceSans3.ttf
          weight: 600
        - asset: assets/fonts/SourceSans3.ttf
          weight: 700
        - asset: assets/fonts/SourceSans3-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/SourceSans3-Italic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/SourceSans3-Italic.ttf
          weight: 700
          style: italic
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel.ttf
          weight: 400
        - asset: assets/fonts/Cinzel.ttf
          weight: 700
    - family: IMFellEnglish
      fonts:
        - asset: assets/fonts/IMFellEnglish-Regular.ttf
          weight: 400
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext.ttf
          weight: 400
        - asset: assets/fonts/AtkinsonHyperlegibleNext.ttf
          weight: 600
        - asset: assets/fonts/AtkinsonHyperlegibleNext.ttf
          weight: 700
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Italic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Italic.ttf
          weight: 700
          style: italic
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora.ttf
          weight: 400
        - asset: assets/fonts/Lora.ttf
          weight: 600
        - asset: assets/fonts/Lora.ttf
          weight: 700
        - asset: assets/fonts/Lora-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Lora-Italic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Lora-Italic.ttf
          weight: 700
          style: italic

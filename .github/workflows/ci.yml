name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  server:
    name: Servidor .NET
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=results.trx"

  app:
    name: Cliente Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  docker:
    # Builds the API image and, on pushes to master, publishes it to GitHub Packages (GHCR) as
    # ghcr.io/<owner>/dnd-companion-api:latest and :sha-<commit>. Other branches and pull requests
    # only build. Versioned tags (:1.2.0) come from the Release workflow.
    name: Imagen Docker de la API
    runs-on: ubuntu-latest
    needs: server
    permissions:
      contents: read
      packages: write # push to GHCR with GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR requires lowercase)
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dnd-companion-api" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ steps.image.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  apk:
    # Builds the APK on every push (artifact) and, on master, publishes it as a GitHub release
    # v<pubspec version>-build.<run number>. Signed with the keystore from the repository secrets
    # (ANDROID_KEYSTORE_*); without them it falls back to the debug key and the release is marked
    # as a prerelease. Versioned releases that are also published to the server come from the
    # Release workflow.
    name: APK
    runs-on: ubuntu-latest
    needs: app
    permissions:
      contents: write # create the release and upload the APK
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Version from pubspec.yaml
        id: version
        run: |
          version="$(sed -n 's/^version: *\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' pubspec.yaml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "file=dnd-companion-$version-build.${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"
      - name: Write the signing key (never committed)
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No hay keystore en los secrets: el APK se firma con la clave de depuración."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secret $name."
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk "${{ steps.version.outputs.file }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dnd-companion-apk
          path: app/${{ steps.version.outputs.file }}
          if-no-files-found: error
          retention-days: 30
      - name: GitHub release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: D&D Companion ${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          body: |
            APK generado desde `${{ github.sha }}`.
            ${{ steps.signing.outputs.signed == 'true' && 'Firmado con el keystore del proyecto.' || 'Firmado con la clave de depuración (sin keystore en los secrets).' }}
          prerelease: ${{ steps.signing.outputs.signed != 'true' }}
          files: app/${{ steps.version.outputs.file }}
          fail_on_unmatched_files: true
      - name: Remove the signing key
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks

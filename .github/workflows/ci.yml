name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Las ejecuciones de master van en fila: cada una etiqueta su versión y la siguiente parte de ella.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  version:
    # Versión semántica calculada por GitVersion (GitVersion.yml): en master, la última etiqueta
    # vX.Y.Z más un parche (o menor/mayor con "+semver: minor|major" en un commit).
    name: Versión (GitVersion)
    runs-on: ubuntu-latest
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
      majorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GitVersion needs the whole history and the tags
      - uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: "6.x"
      - id: gitversion
        uses: gittools/actions/gitversion/execute@v3
      - run: echo "Versión ${{ steps.gitversion.outputs.semVer }}" >> "$GITHUB_STEP_SUMMARY"

  server:
    name: Servidor .NET
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=results.trx"

  app:
    name: Cliente Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  docker:
    # Builds the API image and, on pushes to master, publishes it to GitHub Packages (GHCR) as
    # ghcr.io/<owner>/opentrpg-api:latest, :<version> and :sha-<commit>. Other branches and
    # pull requests only build.
    name: Imagen Docker de la API
    runs-on: ubuntu-latest
    needs: [server, version]
    permissions:
      contents: read
      packages: write # push to GHCR with GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR requires lowercase)
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/opentrpg-api" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          build-args: |
            VERSION=${{ needs.version.outputs.majorMinorPatch }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ needs.version.outputs.majorMinorPatch }}
            ${{ steps.image.outputs.name }}:sha-${{ steps.image.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.semVer }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  apk:
    # Builds the APK on every push (artifact) and, on master, publishes it as the GitHub release
    # v<version> (which also tags the commit, the base of the next GitVersion calculation) and,
    # if DND_API_URL and an admin credential are in the secrets, uploads it to the server so the
    # app offers the update. Signed with the keystore from the secrets (ANDROID_KEYSTORE_*);
    # without them it falls back to the debug key and the release is marked as a prerelease.
    name: APK
    runs-on: ubuntu-latest
    needs: [app, version]
    env:
      DND_API_URL: ${{ secrets.DND_API_URL }}
      DND_ADMIN_TOKEN: ${{ secrets.DND_ADMIN_TOKEN }}
      DND_ADMIN_EMAIL: ${{ secrets.DND_ADMIN_EMAIL }}
      DND_ADMIN_PASSWORD: ${{ secrets.DND_ADMIN_PASSWORD }}
    permissions:
      contents: write # create the release and upload the APK
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Version
        id: version
        env:
          SEMVER: ${{ needs.version.outputs.semVer }}
          MMP: ${{ needs.version.outputs.majorMinorPatch }}
        run: |
          echo "version=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "name=$MMP" >> "$GITHUB_OUTPUT"
          echo "tag=v$SEMVER" >> "$GITHUB_OUTPUT"
          echo "file=opentrpg-$SEMVER.apk" >> "$GITHUB_OUTPUT"
      - name: Write the signing key (never committed)
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No hay keystore en los secrets: el APK se firma con la clave de depuración."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secret $name."
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      # versionName = SemVer (GitVersion); versionCode = run number (Android needs a growing integer).
      - run: flutter build apk --release --build-name=${{ steps.version.outputs.name }} --build-number=${{ github.run_number }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk "${{ steps.version.outputs.file }}"
      - uses: actions/upload-artifact@v4
        with:
          name: opentrpg-apk
          path: app/${{ steps.version.outputs.file }}
          if-no-files-found: error
          retention-days: 30
      - name: GitHub release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: OpenTRPG ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            APK ${{ steps.version.outputs.version }} (build ${{ github.run_number }}) generado desde `${{ github.sha }}`.
            ${{ steps.signing.outputs.signed == 'true' && 'Firmado con el keystore del proyecto.' || 'Firmado con la clave de depuración (sin keystore en los secrets).' }}
          prerelease: ${{ steps.signing.outputs.signed != 'true' }}
          files: app/${{ steps.version.outputs.file }}
          fail_on_unmatched_files: true
      - name: Publish to the server
        id: publish
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && env.DND_API_URL != '' && (env.DND_ADMIN_TOKEN != '' || (env.DND_ADMIN_EMAIL != '' && env.DND_ADMIN_PASSWORD != '')) }}
        env:
          VERSION: ${{ steps.version.outputs.name }}
          BUILD_NUMBER: ${{ github.run_number }}
          FILE: ${{ steps.version.outputs.file }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          api="${DND_API_URL%/}"
          token="$DND_ADMIN_TOKEN"
          if [ -z "$token" ]; then
            # Access tokens last 15 minutes, so log in right before publishing.
            token="$(curl -fsS -X POST "$api/api/v1/auth/login" \
              -H 'Content-Type: application/json' \
              -d "$(jq -n --arg email "$DND_ADMIN_EMAIL" --arg password "$DND_ADMIN_PASSWORD" '{email: $email, password: $password}')" \
              | jq -r '.accessToken')"
            echo "::add-mask::$token"
          fi
          curl --fail-with-body -sS -X POST "$api/api/v1/admin/releases" \
            -H "Authorization: Bearer $token" \
            -F "file=@$FILE;type=application/vnd.android.package-archive" \
            --form-string "version=$VERSION" \
            --form-string "buildNumber=$BUILD_NUMBER" \
            --form-string "notes=${NOTES%%$'\n'*}" \
            --form-string "isMandatory=false"
          echo
          echo "Versión $VERSION (build $BUILD_NUMBER) publicada en el servidor."
      - name: Remove the signing key
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks

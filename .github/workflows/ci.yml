name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  server:
    name: Servidor .NET
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=results.trx"

  app:
    name: Cliente Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  docker:
    name: Imagen Docker de la API
    runs-on: ubuntu-latest
    needs: server
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: false
          tags: dnd-companion-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  apk:
    # Installable development build, signed with the debug key. Every push to the default branch
    # refreshes the rolling "dev-latest" prerelease, so the newest APK is always at
    # https://github.com/<owner>/<repo>/releases/download/dev-latest/dnd-companion-dev.apk.
    # Use the Release workflow for a versioned build published to the server.
    name: APK de desarrollo
    runs-on: ubuntu-latest
    needs: app
    permissions:
      contents: write # move the dev-latest tag and update its prerelease
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk dnd-companion-dev.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dnd-companion-apk
          path: app/dnd-companion-dev.apk
          if-no-files-found: error
          retention-days: 30
      - name: Move the dev-latest tag to this commit
        if: ${{ github.event_name == 'push' }}
        working-directory: .
        run: |
          git tag -f dev-latest "$GITHUB_SHA"
          git push -f origin dev-latest
      - name: Update the dev-latest prerelease
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Build de desarrollo (último push)
          body: |
            APK de desarrollo generado automáticamente desde `${{ github.ref_name }}` en `${{ github.sha }}` (build ${{ github.run_number }}).
            Firmado con la clave de depuración: sirve para probar, no para actualizar una instalación firmada con otra clave.
          prerelease: true
          files: app/dnd-companion-dev.apk
          fail_on_unmatched_files: true

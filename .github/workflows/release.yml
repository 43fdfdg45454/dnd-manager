name: Release

# Manual release: signed APK (GitHub release and, optionally, the server of the instance) and the
# Docker image of the API in GHCR. Run it from Actions > Release > Run workflow.
#
# Secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#     (optional: without them the APK is signed with the debug key and the release is marked as such)
#   DND_API_URL and DND_ADMIN_TOKEN (or DND_ADMIN_EMAIL + DND_ADMIN_PASSWORD)  (optional: publish to the server)

run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version semver (major.minor.patch), por ejemplo 1.2.0"
        required: true
        type: string
      notes:
        description: "Notas de la versión (se muestran en la app)"
        required: false
        type: string
        default: ""
      mandatory:
        description: "Actualización obligatoria (la app se bloquea hasta actualizar)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: Validar versión
    runs-on: ubuntu-latest
    steps:
      - name: Version must be major.minor.patch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::La versión '$VERSION' no tiene el formato mayor.menor.parche (por ejemplo 1.2.0)."
            exit 1
          fi

  apk:
    name: APK firmado
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload the APK
    env:
      VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
      NOTES: ${{ inputs.notes }}
      MANDATORY: ${{ inputs.mandatory }}
      DND_API_URL: ${{ secrets.DND_API_URL }}
      DND_ADMIN_TOKEN: ${{ secrets.DND_ADMIN_TOKEN }}
      DND_ADMIN_EMAIL: ${{ secrets.DND_ADMIN_EMAIL }}
      DND_ADMIN_PASSWORD: ${{ secrets.DND_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the release signing config exists in Gradle
        run: |
          if ! grep -q "key.properties" app/android/app/build.gradle.kts; then
            echo "::error::app/android/app/build.gradle.kts no lee android/key.properties: añade la configuración de firma 'release' (ver deploy/README.md, sección «Firma del APK en Gradle»)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Write the signing key (never committed)
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No hay keystore en los secrets: el APK se firma con la clave de depuración. Configura ANDROID_KEYSTORE_* para una firma propia (ver deploy/README.md)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secret $name."
              exit 1
            fi
          done
          echo "signed=true" >> "$GITHUB_OUTPUT"
          # storeFile is resolved from the app module (app/android/app).
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/android/app/upload-keystore.jks
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > app/android/key.properties

      - name: Build the APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"

      - name: Name the APK
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk "dnd-companion-$VERSION.apk"
          ls -l "dnd-companion-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: dnd-companion-${{ inputs.version }}-apk
          path: dnd-companion-${{ inputs.version }}.apk
          if-no-files-found: error

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: D&D Companion ${{ inputs.version }}
          body: |
            ${{ inputs.notes }}

            ${{ steps.signing.outputs.signed == 'true' && 'APK firmado con el keystore del proyecto.' || 'APK firmado con la clave de depuración (sin keystore configurado): para instalar sobre una versión firmada con otra clave hay que desinstalar antes.' }}
          generate_release_notes: ${{ inputs.notes == '' }}
          prerelease: ${{ steps.signing.outputs.signed != 'true' }}
          files: dnd-companion-${{ inputs.version }}.apk
          fail_on_unmatched_files: true

      - name: Publish to the server
        id: publish
        if: ${{ env.DND_API_URL != '' && (env.DND_ADMIN_TOKEN != '' || (env.DND_ADMIN_EMAIL != '' && env.DND_ADMIN_PASSWORD != '')) }}
        run: |
          api="${DND_API_URL%/}"
          token="$DND_ADMIN_TOKEN"
          if [ -z "$token" ]; then
            # Access tokens last 15 minutes, so log in right before publishing.
            token="$(curl -fsS -X POST "$api/api/v1/auth/login" \
              -H 'Content-Type: application/json' \
              -d "$(jq -n --arg email "$DND_ADMIN_EMAIL" --arg password "$DND_ADMIN_PASSWORD" '{email: $email, password: $password}')" \
              | jq -r '.accessToken')"
            echo "::add-mask::$token"
          fi

          curl --fail-with-body -sS -X POST "$api/api/v1/admin/releases" \
            -H "Authorization: Bearer $token" \
            -F "file=@dnd-companion-$VERSION.apk;type=application/vnd.android.package-archive" \
            --form-string "version=$VERSION" \
            --form-string "buildNumber=$BUILD_NUMBER" \
            --form-string "notes=$NOTES" \
            --form-string "isMandatory=$MANDATORY"
          echo
          echo "Release $VERSION (build $BUILD_NUMBER) publicada en el servidor."

      - name: Server publishing skipped
        if: ${{ steps.publish.outcome == 'skipped' }}
        run: |
          echo "DND_API_URL y DND_ADMIN_TOKEN (o DND_ADMIN_EMAIL y DND_ADMIN_PASSWORD) no están definidos: el APK solo se adjunta a la release de GitHub."

      - name: Remove the signing key
        if: always()
        run: rm -f app/android/key.properties app/android/app/upload-keystore.jks

  docker:
    name: Imagen Docker de la API
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR with GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      - name: Image name (GHCR requires lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dnd-companion-api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          build-args: |
            VERSION=${{ inputs.version }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ inputs.version }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

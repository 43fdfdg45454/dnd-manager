name: dnd-companion

# Las variables se definen en .env (copia de .env.sample). Sin valores por defecto a propósito.
# Ajustes menos habituales (nivel de log, límite de subida, recordatorios, seguridad SMTP...) tienen
# un valor razonable dentro de la imagen; se pueden añadir aquí como variables de entorno si hace falta
# (ver deploy/README.md, "Ajustes opcionales").

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dnd
      POSTGRES_USER: dnd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dnd -d dnd"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=dnd;Username=dnd;Password=${POSTGRES_PASSWORD}
      Database__AutoMigrate: "true"
      App__InitialAdminEmail: ${ADMIN_EMAIL}
      App__DefaultTimeZone: ${DEFAULT_TIME_ZONE}
      Jwt__Secret: ${JWT_SECRET}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__Username: ${SMTP_USERNAME}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS}
      # CA propia para el SMTP u otras conexiones TLS salientes (OpenSSL la carga junto a las públicas).
      SSL_CERT_FILE: /certs/ca.pem
    ports:
      - "${API_BIND}:${API_PORT}:8080"
    volumes:
      - files:/data/files
      - ${CA_BUNDLE_HOST_PATH}:/certs/ca.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  pgdata:
  files:

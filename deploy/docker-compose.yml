name: dnd-companion

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dnd}
      POSTGRES_USER: ${POSTGRES_USER:-dnd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dnd} -d ${POSTGRES_DB:-dnd}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    # Build from the sources (docker compose up -d --build) or set API_IMAGE in .env to a published
    # image (ghcr.io/<owner>/dnd-companion-api:<version>) and run docker compose pull api.
    image: ${API_IMAGE:-dnd-companion-api:local}
    build:
      context: ../server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Minimum log level (Trace, Debug, Information, Warning, Error). Logs are JSON, one event per line.
      Logging__LogLevel__Default: ${LOG_LEVEL:-Information}
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-dnd};Username=${POSTGRES_USER:-dnd};Password=${POSTGRES_PASSWORD}
      Database__AutoMigrate: "true"
      App__PublicUrl: ${PUBLIC_URL:-https://localhost}
      App__InitialAdminEmail: ${ADMIN_EMAIL:-admin@example.com}
      Jwt__Secret: ${JWT_SECRET:?Define JWT_SECRET en .env}
      Smtp__Host: ${SMTP_HOST:-mailhog}
      Smtp__Port: ${SMTP_PORT:-1025}
      Smtp__UseStartTls: ${SMTP_USE_STARTTLS:-false}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-noreply@example.com}
      Smtp__FromName: ${SMTP_FROM_NAME:-D&D Companion}
      FileStorage__MaxUploadMegabytes: ${MAX_UPLOAD_MB:-200}
      App__DefaultTimeZone: ${DEFAULT_TIME_ZONE:-Europe/Madrid}
      Reminders__Enabled: ${REMINDERS_ENABLED:-true}
      Reminders__PollSeconds: ${REMINDERS_POLL_SECONDS:-60}
    volumes:
      - files:/data/files
    healthcheck:
      # Readiness: the API is up and PostgreSQL answers.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # nginx.conf (HTTPS) by default; nginx/nginx.http.conf for a LAN/VPN without TLS (see README).
      - ${NGINX_CONF:-./nginx/nginx.conf}:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro

  # Solo para desarrollo: bandeja de correo en http://localhost:8025
  mailhog:
    image: mailhog/mailhog:v1.0.1
    profiles: ["dev"]
    ports:
      - "8025:8025"

volumes:
  pgdata:
  files:

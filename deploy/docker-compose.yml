name: dnd-companion

# Toda la configuración viene de .env (copia de .env.sample): sin valores fijos ni por defecto aquí.
# Ajustes menos habituales (nivel de log, límite de subida, recordatorios, seguridad SMTP...) tienen
# un valor razonable dentro de la imagen; se pueden añadir aquí como variables de entorno si hace falta
# (ver deploy/README.md, "Ajustes opcionales").

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Database__AutoMigrate: ${DB_AUTO_MIGRATE}
      App__InitialAdminEmail: ${ADMIN_EMAIL}
      App__DefaultTimeZone: ${DEFAULT_TIME_ZONE}
      Jwt__Secret: ${JWT_SECRET}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__Username: ${SMTP_USERNAME}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS}
      # CA propia para el SMTP u otras conexiones TLS salientes (OpenSSL la carga junto a las públicas).
      SSL_CERT_FILE: ${SSL_CERT_FILE}
    ports:
      - "${API_BIND}:${API_PORT}:8080"
    volumes:
      - files:/data/files
      - ${CA_BUNDLE_HOST_PATH}:${SSL_CERT_FILE}:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  pgdata:
  files:

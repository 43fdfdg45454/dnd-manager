name: dnd-companion

# Todas las variables se definen en .env (copia de .env.sample). Sin valores por defecto a propósito.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Logging__LogLevel__Default: ${LOG_LEVEL}
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Database__AutoMigrate: "true"
      App__PublicUrl: ${PUBLIC_URL}
      App__InitialAdminEmail: ${ADMIN_EMAIL}
      App__DefaultTimeZone: ${DEFAULT_TIME_ZONE}
      Jwt__Secret: ${JWT_SECRET}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__Security: ${SMTP_SECURITY}
      Smtp__CheckCertificateRevocation: ${SMTP_CHECK_REVOCATION}
      Smtp__Username: ${SMTP_USERNAME}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS}
      Smtp__FromName: ${SMTP_FROM_NAME}
      FileStorage__MaxUploadMegabytes: ${MAX_UPLOAD_MB}
      Reminders__Enabled: ${REMINDERS_ENABLED}
      Reminders__PollSeconds: ${REMINDERS_POLL_SECONDS}
      SSL_CERT_FILE: ${SSL_CERT_FILE}
    ports:
      - "${API_BIND}:${API_PORT}:8080"
    volumes:
      - files:/data/files
      - ${CA_BUNDLE_HOST_PATH}:${SSL_CERT_FILE}:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  pgdata:
  files:

# Variante SIN TLS para una LAN o una VPN de confianza (por ejemplo WireGuard).
# No usar con acceso desde Internet: contraseñas y tokens viajarían en claro.
# Activar con NGINX_CONF=./nginx/nginx.http.conf en .env y PUBLIC_URL=http://<host-o-ip>.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Debe coincidir con FileStorage:MaxUploadMegabytes (MAX_UPLOAD_MB) en la API.
    client_max_body_size 200m;

    upstream api {
        server api:8080;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
